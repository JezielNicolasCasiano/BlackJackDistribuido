# Para cambiar la cantidad de jugadores o de juegos edite el archivo .env
# (solo hay que cambiar NUM_JUGADORES y NUM_JUEGOS).
services:
  crupier:
    build: .
    command: ["crupier"]
    environment:
      NUM_JUGADORES: ${NUM_JUGADORES:-4}
      NUM_JUEGOS: ${NUM_JUEGOS:-3}

  jugadores:
    build: .
    command: ["jugadores"]
    environment:
      HOST_CRUPIER: crupier
      NUM_HILOS: 1
    deploy:
      replicas: ${NUM_JUGADORES:-4}   # un contenedor por jugador
    depends_on:
      - crupier
