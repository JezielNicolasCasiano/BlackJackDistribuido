# Procesador: sin estado, de 1 a 3 réplicas
---
apiVersion: v1
kind: Service
metadata:
  name: procesador
  namespace: blackjack
spec:
  type: ClusterIP              # solo interno
  selector:
    app: procesador
  ports:
    - port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: procesador
  namespace: blackjack
spec:
  replicas: 1                  # E2 escala con scripts/escalar.sh
  selector:
    matchLabels:
      app: procesador
  template:
    metadata:
      labels:
        app: procesador
    spec:
      containers:
        - name: procesador
          image: blackjack-procesador:0.1
          imagePullPolicy: Never     # imagen local de Minikube
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: blackjack-config
            - secretRef:
                name: postgres-credenciales
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: 500m              # sin límite, E2 no es comparable
              memory: 256Mi
          # Vida: no toca la BD (evita fallas en cascada)
          livenessProbe:
            httpGet:
              path: /salud
              port: 8000
            periodSeconds: 10
            failureThreshold: 3
          # Disponibilidad: revisa la BD
          readinessProbe:
            httpGet:
              path: /listo
              port: 8000
            periodSeconds: 5
            failureThreshold: 1
