# Procesador: sin estado, de 1 a 3 réplicas
---
apiVersion: v1
kind: Service
metadata:
  name: procesador
  namespace: blackjack
spec:
  type: ClusterIP              # solo interno
  selector:
    app: procesador
  ports:
    - port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: procesador
  namespace: blackjack
spec:
  replicas: 1                  # E2 escala con scripts/escalar.sh
  selector:
    matchLabels:
      app: procesador
  template:
    metadata:
      labels:
        app: procesador
    spec:
      containers:
        - name: procesador
          image: blackjack-procesador:0.5
          imagePullPolicy: Never     # imagen local de Minikube
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: blackjack-config
            - secretRef:
                name: postgres-credenciales
          # Calibración (estructura, secc. 7): con 500m, la API (una réplica, 500m)
          # se saturaba antes que 3 procesadores y E2 no podía mostrar mejora.
          # Con 150m, tres réplicas caben bajo la API. Reserva = límite: el pod
          # tiene garantizado justo lo que puede usar
          resources:
            requests:
              cpu: 150m
              memory: 128Mi
            limits:
              cpu: 150m              # sin límite, E2 no es comparable
              memory: 256Mi
          # Al eliminar el pod, espera 5 s antes de que uvicorn reciba SIGTERM: kube-proxy
          # tarda ~1 s en dejar de mandarle conexiones nuevas, y en ese intervalo el pod
          # debe seguir aceptándolas en lugar de rechazarlas
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          # Vida: no toca la BD (evita fallas en cascada)
          livenessProbe:
            httpGet:
              path: /salud
              port: 8000
            periodSeconds: 10
            failureThreshold: 3
          # Disponibilidad: revisa la BD
          readinessProbe:
            httpGet:
              path: /listo
              port: 8000
            periodSeconds: 5
            failureThreshold: 1
