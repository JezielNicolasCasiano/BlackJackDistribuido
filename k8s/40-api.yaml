# API: punto de entrada, 1 réplica fija (diseño, secciones 4.2 y 8.1).
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: blackjack
spec:
  type: NodePort               # expuesta fuera del clúster para que k6 la alcance
  selector:
    app: api
  ports:
    - port: 8000
      nodePort: 30080          # puerto fijo: k6 siempre usa http://$(minikube ip):30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: blackjack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: blackjack-api:0.2
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: blackjack-config
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /salud
              port: 8000
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /listo
              port: 8000
            periodSeconds: 5
