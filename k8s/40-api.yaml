# API: punto de entrada, 1 réplica
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: blackjack
spec:
  type: NodePort               # accesible para k6
  selector:
    app: api
  ports:
    - port: 8000
      nodePort: 30080          # puerto fijo para k6
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: blackjack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: blackjack-api:0.5
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: blackjack-config
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # Igual que el procesador: 5 s para que kube-proxy deje de mandarle conexiones
          # antes de que uvicorn cierre. Con una sola réplica, sin esto se pierden solicitudes
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          livenessProbe:
            httpGet:
              path: /salud
              port: 8000
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /listo
              port: 8000
            periodSeconds: 5
