# PostgreSQL: única pieza con estado
---
# Headless: nombre DNS estable, sin balanceo
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: blackjack
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: blackjack
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16.16          # versión fija
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-credenciales
          env:
            # Subcarpeta para que initdb no choque con archivos del volumen
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: datos
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
  # Un PVC por pod que sobrevive al pod
  volumeClaimTemplates:
    - metadata:
        name: datos
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
