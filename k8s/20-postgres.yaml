# PostgreSQL: la única pieza con estado (diseño, secciones 3 y 8.1).
---
# Service "headless" (clusterIP: None): no balancea, solo da un nombre DNS
# estable a cada pod del StatefulSet (postgres-0.postgres).
# Las demás piezas se conectan a "postgres:5432".
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: blackjack
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: blackjack
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16.16          # versión fija (variable controlada, sección 9.1)
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-credenciales
          env:
            # Subcarpeta dentro del volumen: evita que initdb choque con
            # archivos que el aprovisionador pueda dejar en la raíz.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: datos
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
  # Cada pod del StatefulSet recibe su propio PVC (datos-postgres-0),
  # que NO se borra cuando el pod muere.
  volumeClaimTemplates:
    - metadata:
        name: datos
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
