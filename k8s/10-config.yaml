# Configuración compartida
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: blackjack-config
  namespace: blackjack
data:
  DB_HOST: postgres
  DB_PORT: "5432"
  POOL_SIZE: "10"              # conexiones por réplica
  PROCESADOR_URL: http://procesador:8000
  API_KEEPALIVE: "true"        # false reparte mejor entre pods
  IDEMPOTENCIA: "on"           # off solo en el experimento de control (scripts/idempotencia.sh)
---
# Secret en Git solo por ser un proyecto de laboratorio
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credenciales
  namespace: blackjack
type: Opaque
stringData:
  POSTGRES_USER: blackjack
  POSTGRES_PASSWORD: blackjack-lab
  POSTGRES_DB: blackjack
